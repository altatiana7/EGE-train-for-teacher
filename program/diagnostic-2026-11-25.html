const norm=x=>String(x||'').toLowerCase().replace(/\s+/g,'').trim();function results(){if(!s.done)return '<p>Завершите диагностику для просмотра ключей и ошибок. Ответы сохраняются в этом браузере.</p><button class="btn red" id="finish">Завершить диагностику</button>';const score=(a,b)=>Object.keys(key).filter(n=>+n>=a&&+n<=b&&norm(s.a[n])===norm(key[n])).length;return '<div class="results">'+[[19,24,'Grammar'],[25,29,'Word Formation'],[30,36,'Vocabulary']].map(([a,b,t])=>'<div class="metric">'+t+'<b>'+score(a,b)+' / '+(b-a+1)+'</b></div>').join('')+'</div><h2>Итого 19–36: '+score(19,36)+' / 18</h2>'+Object.keys(key).filter(n=>norm(s.a[n])!==norm(key[n])).map(n=>'<div class="wrong">'+n+' · '+esc(s.a[n]||'—')+' → '+esc(key[n])+'</div>').join('')+'<h2>Email 37 · ручная проверка</h2><div class="passage" style="white-space:pre-wrap">'+esc(s.a[37]||'Нет ответа')+'</div>'+['Решение коммуникативной задачи (0–2)','Организация (0–2)','Языковое оформление (0–2)'].map((x,i)=>'<div class="q">'+x+'<select data-mark="'+i+'">'+[0,1,2].map(v=>'<option '+((s.marks[i]||0)==v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>').join('')+'<p id="total"></p><h2>Essay 38.1 · ручная проверка</h2><div class="passage" style="white-space:pre-wrap">'+esc(s.a[38]||'Нет ответа')+'</div>'+[['Решение коммуникативной задачи',3],['Организация',3],['Лексика',3],['Грамматика',3],['Орфография и пунктуация',2]].map(([label,max],i)=>'<label class="q">'+label+' (0–'+max+')<select data-mark="'+(i+3)+'">'+Array.from({length:max+1},(_,v)=>'<option '+((s.marks[i+3]||0)==v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'<p id="essaytotal"></p><button class="btn secondary" onclick="print()">Печать</button><p class="mini">Авторский тренировочный вариант. 19–29 реконструированы по известным ключам; 30–38 — новые задания, не оригинал пособия.</p>'}
function render(){document.getElementById('title').textContent=sections[s.i];document.getElementById('nav').innerHTML=sections.map((x,i)=>'<button data-i="'+i+'" class="'+(i===s.i?'on':'')+'">'+x+'</button>').join('');document.getElementById('screen').innerHTML='<div class="panel">'+[grammar,formation,vocab,email,essay,results][s.i]()+'</div>';document.getElementById('step').textContent=(s.i+1)+' / 6';document.getElementById('back').disabled=s.i===0;document.getElementById('next').disabled=s.i===5;document.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>go(+e.dataset.i));document.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{s.a[e.dataset.n]=e.value;save();words()});document.querySelectorAll('[data-mark]').forEach(e=>e.onchange=()=>{s.marks[+e.dataset.mark]=+e.value;save();total()});const f=document.getElementById('finish');if(f)f.onclick=()=>{s.done=true;save();render()};words();total()}
function words(){const e=document.getElementById('wc');if(e){const n=(String(s.a[e.dataset.task]||'').trim().match(/\S+/g)||[]).length;const min=+e.dataset.min,max=+e.dataset.max;e.textContent='Words: '+n+' / '+min+'–'+max;e.classList.toggle('ok',n>=min&&n<=max)}}function total(){const e=document.getElementById('total');if(e)e.textContent='Email: '+s.marks.slice(0,3).reduce((a,b)=>a+(b||0),0)+' / 6';const q=document.getElementById('essaytotal');if(q)q.textContent='Essay: '+s.marks.slice(3,8).reduce((a,b)=>a+(b||0),0)+' / 14'}function go(i){s.i=Math.min(5,Math.max(0,i));save();render();scrollTo(0,0)}document.getElementById('back').onclick=()=>go(s.i-1);document.getElementById('next').onclick=()=>go(s.i+1);if(!s.start)s.start=Date.now();save();function tick(){const t=Math.max(0,3600-Math.floor((Date.now()-s.start)/1000));document.getElementById('clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}render();tick();setInterval(tick,1000);
