<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson · Arina EGE - Teacher</title>
<link rel="stylesheet" href="engine.css?v=20261118a">
</head>
<body>
<link rel="stylesheet" href="../ege-written-exam-ui/exam.css"><script src="../ege-written-exam-ui/exam.js"></script><script src="engine.js?v=20261126written"></script>
<script src="data/program.js?v=20261118a"></script>
<script>
(function(){
 const id=new URLSearchParams(location.search).get('id')||'';
 const diagnostics={'diag-1':'diagnostic-2026-11-23.html','diag-2':'diagnostic-2026-11-25.html'};
 if(Object.hasOwn(diagnostics,id)){
  location.replace(diagnostics[id]);
  return;
 }
 const block=window.PROGRAM?.blocks.find(b=>b.lessons?.some(lesson=>lesson.id===id));
 const backHref='index.html'+(block?'#'+block.id:'');
 function showError(message){
  const panel=document.createElement('main');
  panel.style.padding='30px';
  const text=document.createElement('p');
  text.textContent=message;
  const back=document.createElement('a');
  back.href=backHref;
  back.textContent='Вернуться к программе';
  panel.append(text,back);
  document.body.replaceChildren(panel);
 }
 if(!block?.file){
  showError('Этот урок пока недоступен.');
  return;
 }
 const script=document.createElement('script');
 script.src='lessons/'+block.file+'.js?v=20261118a';
 script.onload=function(){
  const lesson=Object.hasOwn(window.LESSONS||{},id)?window.LESSONS[id]:null;
  if(!lesson||typeof renderLesson!=='function'){
   showError('Не удалось открыть урок.');
   return;
  }
  lesson.backHref=backHref;
  renderLesson(lesson);
 };
 script.onerror=()=>showError('Не удалось загрузить материалы урока.');
 document.body.appendChild(script);
})();
</script>
</body>
</html>
