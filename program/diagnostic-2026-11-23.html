<style>

<script>

const interview=[
{a:'I first visited the science museum with my school when I was twelve. I enjoyed the interactive displays, but I only became a volunteer two years later, at fourteen.',q:'Daniel began volunteering at the museum at the age of twelve.',ans:1},
{a:'Most visitors imagine that volunteers simply explain the exhibits. In fact, I spend most of my time helping families find the correct rooms and making sure everyone feels welcome.',q:'Daniel mainly helps visitors find their way around.',ans:0},
{a:'We recently introduced a digital guide. I thought older guests would avoid it, but many of them use it quite confidently after a short introduction.',q:'Older visitors refuse to use the digital guide.',ans:1},

{a:'I volunteer every other Saturday. I wish I could come more often, but exam preparation takes up a lot of my free time.',q:'Daniel volunteers at the museum every Saturday.',ans:1},

{a:'Next summer I may work at a science camp abroad. My family supports the idea, although I have not applied yet.',q:'Daniel has already submitted an application for the science camp.',ans:1}
];
const choices=['True','False','Not stated'];
const aud3script='Presenter: Today we are talking to Maya, who has recently started a school newspaper. Maya, why did you decide to launch it? Maya: Our school website published official announcements, but students rarely had a chance to write about things that mattered to them. I wanted to create a space for their ideas. Presenter: Was it difficult to recruit a team? Maya: At first, I expected dozens of volunteers. Only four students came to our first meeting, but they were incredibly committed. Presenter: How do you choose articles? Maya: We ask students to suggest topics. Some proposals are interesting but too broad, so I encourage the writers to focus on one question and interview at least two people. Presenter: Have you had any problems? Maya: Yes. Once we published a photograph without asking everyone in it for permission. We removed it immediately and introduced a clearer policy. Presenter: Do you prefer online or printed newspapers? Maya: Online articles are cheaper and easier to update. However, we still print a small special edition for school events. Presenter: How do teachers react? Maya: Most are supportive, though a few worry that writing for the newspaper distracts us from homework. We try to prove that we can manage both. Presenter: What is next? Maya: We plan to publish short audio interviews. We already have microphones, but we need someone to teach us how to edit recordings.';
const aud3=[
['Why did Maya start the newspaper?',['To replace the school website','To publish students’ opinions','To advertise school events'],1],
['What surprised Maya at the first meeting?',['The small number of volunteers','The lack of a meeting room','The number of article proposals'],0],
['What does Maya ask writers to do?',['Write longer articles','Avoid interviewing students','Focus on a specific issue'],2],
['What problem did the team experience?',['A photo was published without permission','An article contained false exam dates','The newspaper lost its funding'],0],
['Why does Maya prefer online publication?',['It costs less and is easy to update','It attracts only younger students','It requires no editing'],0],
['What concerns some teachers?',['The newspaper’s political opinions','The effect on study time','The quality of its photographs'],1],
['What does the team need for its next project?',['New microphones','More paper','Audio-editing training'],2]
];
const read10=[
['A','Some cities have started turning unused railway lines into public walking routes. The paths connect neighbourhoods that were previously separated by busy roads.'],
['B','In many libraries, visitors can now borrow tools as well as books. This allows residents to repair furniture or complete small projects without purchasing expensive equipment.'],
['C','A growing number of schools invite professional scientists to discuss their work. These visits help teenagers understand what research jobs are really like.'],
['D','Local councils are creating tiny gardens on the roofs of bus stops. These spaces help insects find food in densely built-up areas.'],
['E','Several museums have introduced quieter visiting hours. Lower noise levels and smaller groups make the exhibitions more accessible to people who are sensitive to sound.'],
['F','Students at one college organise repair workshops where people can bring broken household items. The students gain practical experience while helping neighbours.'],
['G','Some communities are installing public drinking-water stations. They hope this will reduce the number of single-use plastic bottles thrown away every day.']
];
const r10labels=['Improving access to culture','A new use for old transport routes','Sharing equipment instead of owning it','Making a difference through practical skills','A solution to disposable packaging','Bringing real careers into classrooms','Helping city wildlife','Replacing public transport with bicycles'];
const r10key=[1,2,5,6,0,3,4];
const read11text=[
'Learning a second language can change more than your vocabulary. Many people begin studying a language because they hope to travel or work abroad. (A) ___ . However, the benefits can also appear in everyday situations. When learners struggle to express a thought, they often start looking for alternative ways to explain it. (B) ___ . This can be useful when communicating in their first language too. Research into bilingualism is complex, and scientists do not agree that speaking two languages automatically improves every mental skill. (C) ___ . For example, switching between languages may require people to pay attention to the person they are talking to and the situation. Another important factor is motivation. Students who connect the language with an enjoyable activity often continue practising for longer. (D) ___ . Teachers can help by providing tasks that feel meaningful rather than simply asking learners to memorise long lists. Making mistakes is a normal part of the process. (E) ___ . In a supportive classroom, students become more willing to take risks. Finally, it is useful to remember that progress is rarely steady. (F) ___ . Consistent practice matters more than having a perfect day every time.';
const r11opts=['These practical goals can provide strong motivation.','This encourages flexibility in the way they communicate.','Nevertheless, there are good reasons to study how languages are used.','For this reason, personal interests can influence progress.','If learners fear every error, they may stop speaking altogether.','Some weeks feel productive, while others seem frustratingly slow.','As a result, every bilingual student has a better memory.'];
const r11key=[0,1,2,3,4,5];
const read12='When sixteen-year-old Oliver started volunteering at a local community radio station, he imagined he would spend most of his time interviewing musicians. Instead, his first task was to organise old recordings. He was disappointed, but he soon discovered that the archive contained interviews with people who had witnessed important events in the town’s history. Some recordings were difficult to understand because the sound quality was poor. Oliver worked with a technician, who taught him to remove background noise without changing the speakers’ words. This required patience and careful listening. After several weeks, Oliver suggested creating a short programme using the archive. The station manager liked the idea but insisted that Oliver verify the dates and ask permission from the people whose recordings would be used. Finding the original interviewees was not easy. Several had moved away, and one family wanted to hear the recording before making a decision. Oliver respected their request. The finished programme was broadcast in June and received messages from listeners of different ages. Some remembered the events themselves, while younger listeners said they had learned things that were never mentioned in their textbooks. Oliver now hopes to study journalism. He still enjoys music, but he has become particularly interested in stories that might otherwise be forgotten. He believes that technology is useful only when people understand their responsibility towards the individuals behind the information.';
const r12=[
['What did Oliver initially hope to do at the station?',['Interview musicians','Repair recording equipment','Create advertising materials','Research local history'],0],
['Why did the archive attract Oliver’s attention?',['It included historical eyewitness accounts','It contained his family photographs','It was already published online','It focused on modern music'],0],
['What did the technician help Oliver learn?',['How to record songs','How to improve old audio carefully','How to interview politicians','How to purchase studio equipment'],1],
['What did the manager require before the programme could be broadcast?',['A written school report','Permission and fact-checking','A professional presenter','A paid advertising campaign'],1],
['Why did one family delay their decision?',['They wanted to listen first','They had moved abroad','They requested payment','They disagreed about the broadcast date'],0],
['What did younger listeners say about the programme?',['It was too difficult','It told them unfamiliar local stories','It needed more music','It was longer than expected'],1],
['What is Oliver’s main conclusion?',['Technology removes the need for editors','Journalism is easier than music','People have responsibilities when sharing information','Old recordings should never be reused'],2]
];
const sections=[
{id:'a1',title:'Listening · Task 1',time:8,kind:'listen1'},
{id:'a2',title:'Listening · Task 2',time:9,kind:'listen2'},
{id:'a3',title:'Listening · Tasks 3–9',time:13,kind:'listen3'},
{id:'r10',title:'Reading · Task 10',time:8,kind:'read10'},
{id:'r11',title:'Reading · Task 11',time:8,kind:'read11'},
{id:'r12',title:'Reading · Tasks 12–18',time:14,kind:'read12'},
{id:'end',title:'Results · Teacher',time:0,kind:'end'}
];
const answers={},started=Date.now();let current=0,finished=false,showTeacher=false;
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;'}[c]))}
function opts(id,labels){return '<select aria-label="'+esc(id)+'" data-id="'+esc(id)+'"><option value="">— Выбери ответ —</option>'+labels.map((t,i)=>'<option value="'+i+'" '+(answers[id]==i?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'}
function item(id,title,labels){return '<div class="q"><div><b>'+title+'</b></div>'+opts(id,labels)+'</div>'}
function speak(text){if(!('speechSynthesis' in window)){alert('В этом браузере нет голосового синтеза. Используйте текст для преподавателя.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.90;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}
function play(text){return '<div class="play"><button onclick="speak(decodeURIComponent(this.dataset.t))" data-t="'+encodeURIComponent(text)+'">▶ Прослушать</button><button onclick="speechSynthesis.cancel()">■ Стоп</button><button onclick="toggleTeacher()">Текст для преподавателя</button></div><p class="mini">Британский голос выбирается из голосов браузера; качество зависит от устройства. Для строгой экзаменационной диагностики используйте оригинальные аудиоматериалы ФИПИ.</p><div id="teacher" class="teacher'+(showTeacher?' show':'')+'">'+esc(text)+'</div>'}
function toggleTeacher(){showTeacher=!showTeacher;const el=document.getElementById('teacher');if(el)el.classList.toggle('show',showTeacher)}
function html(){
const s=sections[current];let out='<div class="panel"><h2>'+s.title+'</h2><p class="intro">Авторский диагностический материал (не официальный вариант ФИПИ). Ответы скрыты до завершения всей диагностики.</p>';
if(s.kind==='listen1'){out+='<p>Listen to six speakers and match statements A–G to speakers 1–6. One statement is extra.</p><div class="passage">'+a1labels.map((x,i)=>'<p><b>'+String.fromCharCode(65+i)+'.</b> '+esc(x)+'</p>').join('')+'</div>'+play(audio1.map((x,i)=>'Speaker '+(i+1)+'. '+x[0]).join(' '));for(let i=0;i<6;i++)out+=item('a1-'+i,'Speaker '+(i+1),a1labels.map((_,j)=>String.fromCharCode(65+j)))}
if(s.kind==='listen2'){out+='<p>Listen to Daniel talking about volunteering. Choose True, False or Not stated.</p>'+play(interview.map(x=>x.a).join(' '));interview.forEach((x,i)=>out+=item('a2-'+i,(i+1)+'. '+esc(x.q),choices))}
if(s.kind==='listen3'){out+='<p>Listen to an interview with Maya about the school newspaper. Choose one option.</p>'+play(aud3script);aud3.forEach((x,i)=>out+=item('a3-'+i,(i+3)+'. '+esc(x[0]),x[1]))}
if(s.kind==='read10'){out+='<p>Match texts A–G with headings 1–8. One heading is extra.</p><div class="passage">'+r10labels.map((x,i)=>'<p><b>'+(i+1)+'.</b> '+esc(x)+'</p>').join('')+'</div>'+read10.map(x=>'<div class="passage"><strong>Text '+x[0]+'</strong> '+esc(x[1])+'</div>').join('');read10.forEach((x,i)=>out+=item('r10-'+i,'Text '+x[0],r10labels.map((_,i)=>String(i+1))))}
if(s.kind==='read11'){out+='<p>Choose sentences 1–7 for gaps A–F. One sentence is extra.</p><div class="passage text">'+esc(read11text)+'</div><div class="passage">'+r11opts.map((x,i)=>'<p><b>'+(i+1)+'.</b> '+esc(x)+'</p>').join('')+'</div>';for(let i=0;i<6;i++)out+=item('r11-'+i,'Gap '+String.fromCharCode(65+i),r11opts.map((_,i)=>String(i+1)))}
if(s.kind==='read12'){out+='<p>Read the text and answer questions 12–18.</p><div class="passage text">'+esc(read12)+'</div>';r12.forEach((x,i)=>out+=item('r12-'+i,(i+12)+'. '+esc(x[0]),x[1]))}
if(s.kind==='end'){out+='<p>Завершите диагностику, чтобы увидеть баллы и разбор всех заданий. Пропущенные ответы считаются ошибками.</p><button class="btn red" onclick="finish()">Завершить и показать результаты</button>';if(finished)out+=resultHTML()}
out+='</div><div class="actions"><button class="btn secondary" '+(!current?'disabled':'')+' onclick="go('+(current-1)+')">← Back</button><span class="mini">Раздел '+(current+1)+' из '+sections.length+'</span><button class="btn" '+(current===sections.length-1?'disabled':'')+' onclick="go('+(current+1)+')">Next →</button></div>';
return out}
function getKey(){const key={};a1key.forEach((v,i)=>key['a1-'+i]=v);interview.forEach((x,i)=>key['a2-'+i]=x.ans===undefined?2:x.ans);aud3.forEach((x,i)=>key['a3-'+i]=x[2]);r10key.forEach((v,i)=>key['r10-'+i]=v);r11key.forEach((v,i)=>key['r11-'+i]=v);r12.forEach((x,i)=>key['r12-'+i]=x[2]);return key}
function resultHTML(){const keys=getKey(),parts=[['Listening 1','a1-'],['Listening 2','a2-'],['Listening 3–9','a3-'],['Reading 10','r10-'],['Reading 11','r11-'],['Reading 12–18','r12-']];let html='<h2>Итоги диагностики</h2><div class="results">';parts.forEach(([name,prefix])=>{const ids=Object.keys(keys).filter(k=>k.startsWith(prefix));const n=ids.filter(id=>String(answers[id])===String(keys[id])).length;html+='<div class="metric">'+name+'<b>'+n+' / '+ids.length+'</b></div>'});html+='</div><p><b>Всего: '+Object.keys(keys).filter(id=>String(answers[id])===String(keys[id])).length+' / '+Object.keys(keys).length+'</b></p><h3>Ошибки и пропуски</h3>';let bad=0;for(const [id,key] of Object.entries(keys))if(String(answers[id])!==String(key)){bad++;html+='<div class="wrong"><b>'+id+'</b> · ответ: '+(answers[id]===undefined?'—':Number(answers[id])+1)+' · правильный вариант: '+(Number(key)+1)+'</div>'}if(!bad)html+='<div class="wrong success">Все ответы верны.</div>';html+='<button class="btn secondary" onclick="window.print()">Распечатать результаты</button><p class="mini">Авторская диагностика: баллы являются внутренними показателями, не переводятся автоматически во вторичные баллы ЕГЭ. Аудио через синтез речи не заменяет официальную запись.</p>';return html}
function finish(){finished=true;render()}
function go(i){speechSynthesis&&speechSynthesis.cancel();current=Math.max(0,Math.min(i,sections.length-1));showTeacher=false;render()}
function render(){document.getElementById('nav').innerHTML=sections.map((s,i)=>'<button class="'+(i===current?'on':'')+'" onclick="go('+i+')">'+s.title+'</button>').join('');document.getElementById('title').textContent=sections[current].title;document.getElementById('counter').textContent=sections[current].time?sections[current].time+' минут · рекомендуемое время':'Сводная ведомость';document.getElementById('screen').innerHTML=html();document.querySelectorAll('select[data-id]').forEach(el=>el.onchange=()=>answers[el.dataset.id]=el.value);scrollTo(0,0)}
setInterval(()=>{const sec=Math.max(0,3600-Math.floor((Date.now()-started)/1000));document.getElementById('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(!sec)document.getElementById('clock').style.color='#aa2222'},1000);
render();
</script></body></html>
