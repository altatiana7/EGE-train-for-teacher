<script>

const ARINA_DB_URL='https://lzxcmrlubhjfdhtqvqzt.supabase.co';
const ARINA_DB_KEY='sb_publishable_PmyZRwzWne8lqprej4XJQA_XiujtjEI';
function arinaEsc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openArinaHomeworkResults(){
 document.querySelectorAll('.content').forEach(x=>x.classList.remove('on'));
 const root=document.getElementById('trainerView');root.classList.add('on');
 root.innerHTML='<div class="hero"><div class="eyebrow" style="color:#e7f0f8">ARINA · HOMEWORK</div><h1 style="color:#ffffff">Результаты домашней работы Арины</h1></div><div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="action" onclick="loadArinaHomeworkResults()">Обновить</button><button class="action" onclick="changeArinaTeacherCode()">Сменить код</button></div><div id="arinaResultsStatus" style="margin-top:10px;font-weight:800"></div><div id="arinaResultsList" style="display:grid;gap:10px;margin-top:10px"></div></div>';
 loadArinaHomeworkResults();
}
function changeArinaTeacherCode(){
 localStorage.removeItem('arina-teacher-code');
 loadArinaHomeworkResults();
}
async function loadArinaHomeworkResults(){
 const status=document.getElementById('arinaResultsStatus'),list=document.getElementById('arinaResultsList');
 if(!status||!list)return;
 let code=localStorage.getItem('arina-teacher-code')||'';
 if(!code){
  code=prompt('Код доступа к результатам Арины:')||'';
  if(!code){status.textContent='Введите код, чтобы открыть результаты.';return}
  localStorage.setItem('arina-teacher-code',code);
 }
 status.textContent='Загрузка...';list.innerHTML='';
 try{
  const r=await fetch(ARINA_DB_URL+'/rest/v1/rpc/get_arina_homework',{
   method:'POST',
   headers:{'apikey':ARINA_DB_KEY,'Authorization':'Bearer '+ARINA_DB_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({p_teacher_code:code})
  });
  if(!r.ok){
   if(r.status===400||r.status===401||r.status===403){localStorage.removeItem('arina-teacher-code');status.textContent='Неверный код доступа. Нажмите «Обновить» и введите код ещё раз.';return}
   throw new Error('load_failed');
  }
  const rows=await r.json();
  status.textContent=rows.length?'Сдано работ: '+rows.length:'Арина пока ничего не отправила.';
  list.innerHTML=rows.map(renderArinaSubmission).join('');
 }catch(e){status.textContent='Не удалось загрузить результаты. Проверьте интернет и нажмите «Обновить».'}
}
function renderArinaSubmission(r){
 const when=new Date(r.created_at).toLocaleString('ru-RU');
 const pct=r.max_score?Math.round(r.score/r.max_score*100):0;
 const details=Array.isArray(r.details)?r.details:[];
 const rows=details.map((d,i)=>'<tr><td>'+(i+1)+'</td><td>'+arinaEsc(d.question||d.prompt||'')+'</td><td>'+arinaEsc(d.chosen??'')+'</td><td>'+arinaEsc(d.correct??'')+'</td><td>'+(d.is_correct?'✓':'ошибка')+'</td></tr>').join('');
 return '<div class="lesson" style="margin:0"><div style="padding:12px"><div class="eyebrow">'+arinaEsc(when)+'</div><h2 style="margin:4px 0">'+arinaEsc(r.test_title||r.test_id)+'</h2><div style="font-size:18px;font-weight:900">'+r.score+' / '+r.max_score+' · '+pct+'%</div><div style="font-size:11px;color:var(--mut);margin-top:3px">ID: '+arinaEsc(r.code||'')+'</div><details style="margin-top:10px"><summary style="cursor:pointer;font-weight:900">Показать ответы</summary><div style="overflow:auto;margin-top:8px"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th>#</th><th style="text-align:left">Задание</th><th style="text-align:left">Ответ Арины</th><th style="text-align:left">Правильный</th><th>Результат</th></tr></thead><tbody>'+rows+'</tbody></table></div></details></div></div>';
}

const fipiReadingTexts=[{"title":"Snowflakes","source":"FIPI Demo 2026 · adapted in-site practice","url":"https://fipi.ru/ege/demoversii-specifikacii-kodifikatory","text":"Snowflakes form when tiny drops of water freeze high in the atmosphere. Their shapes depend on temperature and the amount of moisture in the air. Although two snowflakes may look similar, small changes during their journey can make their patterns different. Scientists usually group snow crystals by their basic structure, such as plates, columns and needles. As a crystal falls, it may pass through layers of warmer or colder air. This changes the way new ice grows on its surface. Researchers study snowflakes because these delicate crystals can provide useful information about clouds, weather conditions and the processes that take place inside the atmosphere.","focus":"atmosphere · moisture · although · structure · surface · researchers"},{"title":"Urban trees","source":"FIPI-format practice · official Task 1 link","url":"https://ege.fipi.ru/bank/index.php?proj=4B53A6CB75B0B5E1427E596EB4931A2A&qid=78cB6D","text":"Trees play an important role in modern cities. They provide shade, reduce noise and help make streets more comfortable in hot weather. Leaves can also trap some of the dust and tiny particles found in polluted air. In addition, trees absorb carbon dioxide and release oxygen. However, planting trees in a city is not as simple as it may seem. Different species need different amounts of water, light and space. Their roots can sometimes damage pavements if they are planted in unsuitable places. For this reason, city planners carefully choose where each tree should grow and how it should be maintained.","focus":"important · comfortable · polluted · oxygen · species · maintained"},{"title":"Sleep and memory","source":"FIPI-format practice · official Task 1 link","url":"https://ege.fipi.ru/bank/index.php?proj=4B53A6CB75B0B5E1427E596EB4931A2A&qid=e1B917","text":"Sleep is essential for both the body and the brain. During the night, the brain does not simply switch off. It continues to process information and organise memories formed during the day. Researchers have found that students often remember new material better after enough sleep. Lack of sleep, on the other hand, can make it harder to concentrate and solve problems. Teenagers usually need more sleep than adults because their bodies and brains are still developing. A regular sleep schedule may also help people feel more alert in the morning. This is why experts recommend avoiding bright screens and heavy meals shortly before bedtime.","focus":"essential · organise · researchers · concentrate · developing · recommend"},{"title":"Electric transport","source":"FIPI-format practice · official Task 1 link","url":"https://ege.fipi.ru/bank/index.php?proj=4B53A6CB75B0B5E1427E596EB4931A2A&qid=cc183D","text":"Many cities are introducing electric buses as part of their public transport systems. Unlike traditional buses, electric vehicles do not produce exhaust gases while they are moving. This can improve air quality, especially in busy city centres. Electric buses are also quieter, which may reduce traffic noise. However, they require special charging stations and reliable electricity supplies. Their batteries are expensive and gradually lose capacity over time. Engineers are working on new battery technologies that can store more energy and charge more quickly. As these systems improve, electric buses may become a more common sight on urban roads around the world.","focus":"vehicles · exhaust · quality · require · gradually · engineers"},{"title":"Honeybees","source":"FIPI-format practice · official Task 1 link","url":"https://ege.fipi.ru/bank/index.php?proj=4B53A6CB75B0B5E1427E596EB4931A2A&qid=F7D901","text":"Honeybees live in highly organised colonies where thousands of insects work together. Each colony usually contains one queen, many female worker bees and a smaller number of male bees. Worker bees collect nectar and pollen, protect the hive and care for young bees. They can also communicate the location of food through a special movement often called a dance. Bees are important not only because they produce honey. As they travel from flower to flower, they carry pollen and help many plants reproduce. Farmers therefore depend on bees and other insects for the successful production of numerous fruits, vegetables and seeds.","focus":"colonies · contains · nectar · communicate · reproduce · numerous"},{"title":"Volcanoes","source":"FIPI-format practice · official Task 1 link","url":"https://ege.fipi.ru/bank/index.php?proj=4B53A6CB75B0B5E1427E596EB4931A2A&qid=349eF5","text":"Volcanoes are openings in the Earth’s surface through which hot material can escape from deep underground. Some volcanoes erupt frequently, while others may remain quiet for hundreds of years. Scientists monitor active volcanoes by measuring small earthquakes, changes in temperature and movements of the ground. These signs can sometimes show that magma is rising towards the surface. Predicting an eruption is still difficult because every volcano behaves differently. Even so, careful monitoring can help local authorities prepare people for possible danger. Volcanic activity can be destructive, but it can also create new land and produce soils that are rich in minerals.","focus":"surface · frequently · monitor · measuring · authorities · destructive"}];

function stativeInfo(){
 return '<div class="stativeCompact">'+
 '<div class="stCard"><b>STATE VERBS</b><small>feelings, thoughts, possession, senses, relationships and states · usually NOT Continuous</small><p><strong>Feelings / opinions:</strong> like, love, hate, prefer, adore, dislike, detest, appreciate, care, mind, wish</p><p><strong>Thinking / knowledge:</strong> know, believe, understand, remember, forget, mean, realise, recognise, suppose, doubt, imagine, agree</p><p><strong>Possession / relationship:</strong> have, own, possess, belong, need, want, owe, depend, contain, consist, include, involve</p><p><strong>Senses / appearance:</strong> seem, appear, smell, taste, look, sound, feel</p></div>'+
 '<div class="stCard"><b>DYNAMIC VERBS</b><small>actions and processes · Continuous is common</small><p>run · study · work · play · read · talk · write · travel · cook · build · change · grow · improve · develop</p></div>'+
 '<div class="stCard stBoth"><b>VERBS THAT CAN BE BOTH · MEANING CHANGES</b><small>Learn the meaning, not only the verb.</small>'+
 '<p><strong>think:</strong> I think it is useful. ↔ I am thinking about the problem.</p>'+
 '<p><strong>have:</strong> She has a car. ↔ She is having lunch / a shower / a good time.</p>'+
 '<p><strong>see:</strong> I see what you mean. ↔ I am seeing the dentist tomorrow.</p>'+
 '<p><strong>look:</strong> You look tired. ↔ She is looking at the screen.</p>'+
 '<p><strong>feel:</strong> I feel tired. ↔ I am feeling the fabric.</p>'+
 '<p><strong>taste:</strong> The soup tastes salty. ↔ The chef is tasting the soup.</p>'+
 '<p><strong>smell:</strong> The flowers smell lovely. ↔ He is smelling the flowers.</p>'+
 '<p><strong>appear:</strong> He appears calm. ↔ He is appearing on TV tonight.</p>'+
 '<p><strong>be:</strong> He is rude. ↔ He is being rude today.</p>'+
 '<p><strong>weigh:</strong> The bag weighs 10 kilos. ↔ She is weighing the bag.</p>'+
 '<p><strong>measure:</strong> The room measures 20 m². ↔ They are measuring the room.</p>'+
 '<p><strong>fit:</strong> This jacket fits me. ↔ They are fitting a new kitchen.</p>'+
 '<p><strong>mean:</strong> This sign means stop. ↔ I was not meaning to upset you.</p>'+
 '<p><strong>consider:</strong> I consider him reliable. ↔ We are considering moving abroad.</p>'+
 '<p><strong>expect:</strong> I expect she is at home. ↔ We are expecting guests tonight.</p>'+
 '<p><strong>enjoy:</strong> I enjoy tennis. ↔ I am enjoying the course.</p>'+
 '<p><strong>love / like:</strong> I love this city. ↔ I am loving / liking the experience. <small>(informal/emphatic)</small></p>'+
 '</div>'+
 '<div class="stCard"><b>COMMON MISTAKES</b><p>✕ I am knowing the answer. → ✓ I know the answer.</p><p>✕ She is wanting some water. → ✓ She wants some water.</p><p>✕ He is having a blue bike. → ✓ He has a blue bike.</p><p>✕ This soup is tasting strange. → ✓ This soup tastes strange.</p></div>'+
 '<div class="stCard stTip"><b>USEFUL TIP</b><p>Ask what the verb means <strong>in this sentence</strong>. State/quality/opinion/possession → usually Simple. Deliberate action/process/temporary behaviour → Continuous may be possible.</p></div>'+
 '</div>';
}
function wordwallTestHTML(items,key){
 return '<div class="inlineTest" data-ww="'+key+'"><div class="wwStage"></div></div>';
}
function openWordwall(btn,key,type){
 const box=btn.nextElementSibling;box.style.display=box.style.display==='block'?'none':'block';
 if(box.style.display==='block'&&!box.dataset.started){box.dataset.started='1';box._items=(type==='stative'?stativeQuiz:quiz).map((q,i)=>({q:q,i:i}));box._pos=0;box._score=0;showWordwall(box,key)}
}
function studentTestHTML(items,key,submitKey,title){
 return '<div class="studentTest" data-key="'+key+'" data-submitkey="'+submitKey+'" data-title="'+title+'"><div class="wwStage"></div></div>';
}
function initStudentTest(box,items=quiz){box._items=items.map((q,i)=>({q:q,i:i}));box._pos=0;box._answers=[];showStudentQuestion(box)}
function showStudentQuestion(box){
 const stage=box.querySelector('.wwStage'),item=box._items[box._pos],q=item.q;
 stage.innerHTML='<div class="wwTop"><span>QUESTION '+(box._pos+1)+' / '+box._items.length+'</span></div><div class="wwQ"><p><b>'+(box._pos+1)+'.</b> '+q[0]+'</p><div class="wwOpts">'+q[1].map((o,j)=>'<button type="button" data-i="'+j+'">'+o+'</button>').join('')+'</div></div>';
 stage.querySelectorAll('.wwOpts button').forEach(btn=>btn.onclick=()=>{box._answers[box._pos]=+btn.dataset.i;if(box._pos<box._items.length-1){box._pos++;showStudentQuestion(box)}else showFinalSubmit(box)})
}
function showFinalSubmit(box){
 const stage=box.querySelector('.wwStage');
 stage.innerHTML='<div class="wwQ"><p><b>25 / 25</b></p><p>Все ответы сохранены. После отправки изменить их или пройти тест повторно нельзя.</p><div class="submitStatus"></div></div>';
}
function submitStudentTest(btn){
 const box=btn.closest('.studentTest'),submitKey=box.dataset.submitkey;
 if(localStorage.getItem('submitted-'+submitKey)){btn.disabled=true;btn.textContent='Уже отправлено';return}
 let good=0;box._items.forEach((it,i)=>{if(box._answers[i]===+it.q[2])good++});
 const stamp=new Date().toLocaleString('ru-RU'),code=(submitKey+'-'+good+'-'+box._items.length).toUpperCase();
 localStorage.setItem('submitted-'+submitKey,JSON.stringify({title:box.dataset.title,score:good,total:box._items.length,date:stamp,code:code,answers:box._answers}));
 btn.disabled=true;btn.textContent='Отправлено';
 box.querySelector('.submitStatus').textContent='Результат отправлен учителю. Повторная попытка заблокирована.';
}
function showWordwall(box,key){
 const stage=box.querySelector('.wwStage'),item=box._items[box._pos];
 if(!item){stage.innerHTML='<div class="wwQ"><p><b>Тест завершён.</b></p></div>';return}
 const q=item.q;
 stage.innerHTML='<div class="wwTop"><span>QUESTION '+(box._pos+1)+' / '+box._items.length+'</span></div><div class="wwQ"><p><b>'+(box._pos+1)+'.</b> '+q[0]+'</p><div class="wwOpts">'+q[1].map((o,j)=>'<button type="button" data-i="'+j+'">'+o+'</button>').join('')+'</div></div>';
 stage.querySelectorAll('.wwOpts button').forEach(btn=>btn.onclick=()=>{box._answers=box._answers||[];box._answers[box._pos]=+btn.dataset.i;box._pos++;showWordwall(box,key)})
}
function stativeQhtml(key){return wordwallTestHTML(stativeQuiz,key)}

const starterTexts=[
'Education has changed considerably over the last few decades. Students can now use digital libraries, online courses and educational applications to find information almost instantly. Yet technology does not automatically make learning effective. Successful students still need to organise their time, read critically and practise new skills regularly. Teachers also remain important because they help learners select reliable sources, understand difficult ideas and receive useful feedback. Another essential skill is the ability to work independently. At university and in professional life, people are often expected to plan complex tasks without constant supervision. For this reason, school students benefit from learning how to set realistic goals, monitor their progress and reflect on mistakes. These habits may seem simple, but together they can make learning more efficient and prepare young people for situations in which they have to make decisions on their own.',
'Scientists have long been interested in the connection between sleep and learning. During sleep, the brain continues to process information received during the day. Research suggests that regular sleep is important for attention, memory and problem-solving. Teenagers, however, often sleep less than they need because of homework, social media and irregular schedules. Lack of sleep can make it more difficult to concentrate in class and may reduce the effectiveness of revision. Studying late into the night is therefore not always the best strategy before an important test. A more productive approach is to distribute revision over several days, take short breaks and maintain a regular sleeping routine. These habits do not remove the need for serious study, but they can help learners use their study time more effectively and arrive at an examination able to focus on the tasks in front of them.',
'Many cities are trying to make public spaces more comfortable and environmentally friendly. One approach is to create more areas where people can walk or cycle safely. Such projects can reduce traffic in crowded districts and encourage residents to be more physically active. They can also make neighbourhoods quieter and provide additional space for trees and outdoor cafés. However, changing a city transport system is rarely simple. Local authorities have to consider the needs of residents, businesses, drivers and public transport users. A successful project therefore requires careful planning and clear communication. Before introducing permanent changes, some cities test new street designs for a limited period and collect feedback from the public. This allows planners to identify practical problems and improve the project before large amounts of money are spent.',

function startVerbGame(root){
 const start=+root.dataset.start,end=+root.dataset.end,pool=irregularVerbs.slice(start,end);
 root._order=[...Array(pool.length).keys()].sort(()=>Math.random()-.5);root._pos=0;root._score=0;showVerbRound(root);
}
function showVerbRound(root){
 const start=+root.dataset.start,end=+root.dataset.end,pool=irregularVerbs.slice(start,end),game=root.querySelector('.verbGame');
 if(!root._order)startVerbGame(root);
 if(root._pos>=root._order.length){game.innerHTML='<div class="vpFb">Готово: '+root._score+' / '+root._order.length+'</div><button class="action" onclick="startVerbGame(this.closest(\'.verbPractice\'))">Ещё раз · перемешать</button>';return}
 const idx=root._order[root._pos],a=pool[idx].split('|'),v1=a[0],v2=a[1],v3=a[2],correct=v2+' · '+v3;
 const regular=v1.endsWith('e')?v1+'d':v1+'ed';
 const all=irregularVerbs.map(s=>s.split('|'));
 const sameV2=all.find(x=>x[1]===v2&&x[0]!==v1);
 const sameV3=all.find(x=>x[2]===v3&&x[0]!==v1);
 let distractors=[
   v2+' · '+regular,
   regular+' · '+v3,
   regular+' · '+regular,
   v3+' · '+v2,
   sameV2 ? sameV2[1]+' · '+sameV2[2] : null,
   sameV3 ? sameV3[1]+' · '+sameV3[2] : null
 ].filter(x=>x&&x!==correct);
 let opts=[correct,...new Set(distractors)].slice(0,4);
 while(opts.length<4){
   const x=all[Math.floor(Math.random()*all.length)];
   const forms=x[1]+' · '+x[2];
   if(!opts.includes(forms))opts.push(forms);
 }
 opts.sort(()=>Math.random()-.5);
 game.innerHTML='<div class="vpPrompt"><small>'+(root._pos+1)+' / '+root._order.length+'</small><strong>'+v1+'</strong><span>'+a[3]+'</span></div><div class="vpChoices">'+opts.map(x=>'<button type="button" data-ok="'+(x===correct)+'">'+x+'</button>').join('')+'</div><div class="vpFb"></div>';
 game.querySelectorAll('.vpChoices button').forEach(btn=>btn.onclick=()=>{const ok=btn.dataset.ok==='true';game.querySelectorAll('.vpChoices button').forEach(x=>x.disabled=true);btn.classList.add(ok?'vGood':'vBad');if(ok)root._score++;game.querySelector('.vpFb').textContent=ok?'Correct':'Правильно: '+correct;setTimeout(()=>{root._pos++;showVerbRound(root)},650)});
}

}
function priorityHTML(){return diagnosticSummary().sort((a,b)=>a.pct-b.pct).map(x=>'<div class="priorityRow"><b>'+x.name+'</b><span class="priorityTag '+x.cls+'">'+x.got+'/'+x.max+' · '+x.pct+'% · '+scoreLabel(x.pct)+'</span></div>').join('')}
function saveDiagScore(k,v,max){let n=v===''?'':Math.max(0,Math.min(max,Number(v)||0));diagnosticData.scores[k]=n;localStorage.setItem('teacherDiagnosticV1',JSON.stringify(diagnosticData));const item=document.querySelector('[data-diag="'+k+'"]');if(item){const p=Math.round((Number(n)||0)/max*100);item.className='diagItem '+(n===''?'':scoreClass(p));item.querySelector('.diagPct').textContent=n===''?'не внесено':p+'% · '+scoreLabel(p)}const total=diagnosticParts.reduce((a,x)=>a+(Number(diagnosticData.scores[x[0]])||0),0),mx=82,pct=Math.round(total/mx*100);const t=document.getElementById('diagTotal');if(t)t.textContent=total+' / '+mx+' · '+pct+'%';const p=document.getElementById('diagPriority');if(p)p.innerHTML=priorityHTML()}
function saveDiagnosticNotes(){diagnosticData.notes=document.getElementById('diagNotes')?.value||'';diagnosticData.date=document.getElementById('diagDate')?.value||'';localStorage.setItem('teacherDiagnosticV1',JSON.stringify(diagnosticData))}
function resetDiagnostic(){diagnosticData={scores:{},notes:'',date:''};localStorage.setItem('teacherDiagnosticV1',JSON.stringify(diagnosticData));showTeacherDashboard('diagnostic')}
function teacherProgressHTML(){
 const ds=diagnosticSummary(),done=weeks.filter((_,i)=>(teacherWeekState[i]||'planned')==='done').length,active=weeks.findIndex((_,i)=>(teacherWeekState[i]||'planned')==='active');
 return '<div class="teacherDash"><div class="hero"><div class="eyebrow">Teacher only</div><h1>Прогресс и контроль</h1></div><div class="teacherDashGrid"><section class="teacherPanel"><h2>Профиль по диагностике</h2><div class="progressRows">'+ds.map(x=>'<div class="progressRow"><b>'+x.name+'</b><div class="progressTrack"><div class="progressFill" style="width:'+x.pct+'%"></div></div><span>'+x.pct+'%</span></div>').join('')+'</div></section><section class="teacherPanel"><h2>Курс</h2><div class="teacherTotal"><div><span>Закрыто недель</span><br><b>'+done+' / '+weeks.length+'</b></div><div><span>Сейчас</span><br><b>'+(active>=0?'W'+(active+1):'—')+'</b></div></div><p class="teacherLead" style="margin-top:10px">Статус недели меняй непосредственно внутри нужной недели. После «Закрыто» она отмечается слева галочкой.</p></section></div><section class="teacherPanel" style="margin-top:10px"><h2>Следующий фокус</h2><div class="priorityList">'+priorityHTML()+'</div></section></div>';
}
function teacherErrorsHTML(){
 return '<div class="teacherDash"><div class="hero"><div class="eyebrow">Teacher only</div><h1>Personal Error Log</h1></div><section class="teacherPanel"><h2>Добавить ошибку</h2><div class="errorForm"><div><label>ДАТА</label><input id="errDate" type="date"></div><div><label>ЗАДАНИЕ</label><input id="errTask" placeholder="19 / 38 / 41"></div><div><label>ОШИБКА</label><input id="errMistake" placeholder="Что именно не получилось"></div><div><label>ПРАВИЛО / КОРРЕКЦИЯ</label><input id="errRule" placeholder="Краткое правило + правильная форма"></div><div><label>RETEST</label><input id="errRetest" type="date"></div><button class="teacherBtn" onclick="addTeacherError()">ДОБАВИТЬ</button></div><div id="errorTableWrap">'+errorTableHTML()+'</div></section></div>';
}
function errorTableHTML(){if(!teacherErrors.length)return '<div class="teacherEmpty">Ошибок пока нет. Добавляй сюда только повторяющиеся или экзаменационно значимые ошибки.</div>';return '<table class="errorTable"><thead><tr><th>Дата</th><th>№</th><th>Ошибка</th><th>Коррекция</th><th>Retest</th><th></th></tr></thead><tbody>'+teacherErrors.map((x,i)=>'<tr><td>'+safeText(x.date)+'</td><td><b>'+safeText(x.task)+'</b></td><td>'+safeText(x.mistake)+'</td><td>'+safeText(x.rule)+'</td><td>'+safeText(x.retest||'—')+'</td><td><button class="errorDone" onclick="removeTeacherError('+i+')">✓</button></td></tr>').join('')+'</tbody></table>'}
function addTeacherError(){const x={date:document.getElementById('errDate').value,task:document.getElementById('errTask').value.trim(),mistake:document.getElementById('errMistake').value.trim(),rule:document.getElementById('errRule').value.trim(),retest:document.getElementById('errRetest').value};if(!x.task||!x.mistake)return;teacherErrors.unshift(x);localStorage.setItem('teacherErrorLogV1',JSON.stringify(teacherErrors));document.getElementById('errorTableWrap').innerHTML=errorTableHTML()}
function removeTeacherError(i){teacherErrors.splice(i,1);localStorage.setItem('teacherErrorLogV1',JSON.stringify(teacherErrors));document.getElementById('errorTableWrap').innerHTML=errorTableHTML()}
function teacherPlanHTML(){return '<div class="teacherDash"><div class="hero"><div class="eyebrow">Teacher only</div><h1>Маршрут подготовки · 32 недели</h1></div><section class="teacherPanel"><h2>Логика курса</h2><div class="progressRows">'+[['W1–11','Системная грамматика'],['W12–16','ЕГЭ Grammar / Word Formation / Vocabulary'],['W17–19','Reading'],['W20–22','Listening'],['W23–27','Writing 37–38'],['W28–31','Speaking 39–42'],['W32','Полные пробники + точечная коррекция']].map(x=>'<div class="priorityRow"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div></section></div>'}
function showTeacherDashboard(view){
 document.body.classList.remove('fullWeek');const lp=document.getElementById('lessonPage');if(lp)lp.style.display='none';
 document.getElementById('examView').classList.remove('on');document.getElementById('trainerView').classList.remove('on');document.getElementById('weekView').classList.add('on');
 document.querySelectorAll('.wbtn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.teacherNav').forEach(b=>b.classList.toggle('active',b.dataset.teachernav===view));
 document.getElementById('weekView').innerHTML=view==='progress'?teacherProgressHTML():view==='errors'?teacherErrorsHTML():view==='plan'?teacherPlanHTML():teacherDiagHTML();
 if(innerWidth<801)document.getElementById('side').classList.remove('open');scrollTo({top:0,behavior:'smooth'});
}
function teacherWeekCard(i,w){
 const st=teacherWeekState[i]||'planned',note=localStorage.getItem('teacherWeekNote-'+i)||'';
 return '<div class="weekTeacherBar"><section class="teacherPanel"><div class="eyebrow">Teacher focus</div><div class="weekGoalLine"><b>Цель:</b> '+w.g+'<br><b>Критерий готовности:</b> '+w.r+'</div></section><section class="teacherPanel"><div class="weekControls"><select onchange="setTeacherWeekState('+i+',this.value)"><option value="planned" '+(st==='planned'?'selected':'')+'>Запланировано</option><option value="active" '+(st==='active'?'selected':'')+'>В работе</option><option value="done" '+(st==='done'?'selected':'')+'>Закрыто</option></select><textarea placeholder="Заметка учителя…" data-week="'+i+'" oninput="saveTeacherWeekNote(Number(this.dataset.week),this.value)">'+safeText(note)+'</textarea></div></section></div>';
}
function saveTeacherWeekNote(i,v){localStorage.setItem('teacherWeekNote-'+i,v)}
function setTeacherWeekState(i,v){teacherWeekState[i]=v;localStorage.setItem('teacherWeekStateV1',JSON.stringify(teacherWeekState));renderButtons();document.querySelectorAll('.wbtn').forEach(b=>b.classList.toggle('active',+b.dataset.i===i))}


let fipiReadIndex=0,fipiReadTimerId=null,fipiReadSeconds=90;
function openFipiReading(){
 document.body.classList.remove('fullWeek');
 var lp=document.getElementById('lessonPage');if(lp)lp.style.display='none';
 document.getElementById('examView').classList.remove('on');
 document.getElementById('trainerView').classList.remove('on');
 document.getElementById('weekView').classList.add('on');
 document.querySelectorAll('.wbtn,.teacherNav').forEach(function(x){x.classList.remove('active')});
 renderFipiReading();
 if(innerWidth<801)document.getElementById('side').classList.remove('open');
 scrollTo({top:0,behavior:'smooth'});
}
function renderFipiReading(){
 var x=fipiReadingTexts[fipiReadIndex];
 document.getElementById('weekView').innerHTML=
 '<div class="fipiReadShell"><div class="hero"><div class="eyebrow">EGE · SPEAKING · TASK 1</div><h1>READING · ФИПИ</h1></div>'+
 '<div class="fipiReadHead"><div><b>'+x.title+'</b><br><span>1.5 min preparation · 1.5 min reading</span></div><div class="fipiReadTimer" id="fipiReadTimer">01:30</div></div>'+
 '<div class="fipiReadCard"><div class="fipiReadSource"><span>'+x.source+'</span><a href="'+x.url+'" target="_blank" rel="noopener">ОФИЦИАЛЬНЫЙ ИСТОЧНИК ↗</a></div>'+
 '<div class="fipiReadText" id="fipiReadText">'+x.text+'</div>'+
 '<div class="fipiReadTip"><b>Pronunciation focus:</b> '+x.focus+'</div>'+
 '<div class="fipiReadActions"><button onclick="startFipiReadTimer(90)">PREP · 1:30</button><button onclick="startFipiReadTimer(90)">READ · 1:30</button><button onclick="speakFipiReading()">BRITISH AUDIO</button><button onclick="resetFipiReadTimer()">RESET</button></div>'+
 '<div class="fipiReadNav"><button onclick="moveFipiReading(-1)">←</button><div class="fipiReadCounter">'+(fipiReadIndex+1)+' / '+fipiReadingTexts.length+' · NEXT по стрелкам</div><button onclick="moveFipiReading(1)">→</button></div></div></div>';
}
function moveFipiReading(d){fipiReadIndex=(fipiReadIndex+d+fipiReadingTexts.length)%fipiReadingTexts.length;resetFipiReadTimer();renderFipiReading()}
function resetFipiReadTimer(){clearInterval(fipiReadTimerId);fipiReadSeconds=90;var e=document.getElementById('fipiReadTimer');if(e)e.textContent='01:30'}
function startFipiReadTimer(sec){clearInterval(fipiReadTimerId);fipiReadSeconds=sec;var e=document.getElementById('fipiReadTimer');function draw(){if(!e)return;var m=String(Math.floor(fipiReadSeconds/60)).padStart(2,'0'),s=String(fipiReadSeconds%60).padStart(2,'0');e.textContent=m+':'+s;if(fipiReadSeconds<=0){clearInterval(fipiReadTimerId);return}fipiReadSeconds--}draw();fipiReadTimerId=setInterval(draw,1000)}
function speakFipiReading(){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(fipiReadingTexts[fipiReadIndex].text);u.lang='en-GB';u.rate=.88;var vs=speechSynthesis.getVoices();u.voice=vs.find(function(v){return /en-GB/i.test(v.lang)&&/Daniel|George|Arthur|Oliver|male/i.test(v.name)})||vs.find(function(v){return /en-GB/i.test(v.lang)})||null;speechSynthesis.speak(u)}

document.getElementById('mobileBtn').onclick=()=>document.getElementById('side').classList.toggle('open');renderButtons();renderWeek(0);
</script><!-- pages-republish -->
</body></html>
